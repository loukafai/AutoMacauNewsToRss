name: 每日自動更新澳門日報 RSS

on:
  schedule:
    # 澳門時間 06:17 (UTC+8) = UTC 前一天 22:17
    - cron: '17 20 * * *'
    # 澳門時間 08:23 (UTC+8) = UTC 當天 00:23
    - cron: '23 22 * * *'
  workflow_dispatch: # 允許在 GitHub 網頁上手動點擊 "Run workflow" 執行

permissions:
  contents: write # 允許 Action 寫入與提交程式碼到 repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 簽出程式碼 (Checkout repository)
        uses: actions/checkout@v7

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 安裝依賴套件
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests beautifulsoup4
          fi

      - name: 🚀 執行爬蟲腳本生成檔案
        run: python main.py

      - name: 💾 提交並推送到 GitHub (Commit and Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add rss.xml index.html
          git commit -m "📝 自動更新今日新聞 (RSS & HTML)" || exit 0
          git push

      - name: 📡 推送完成後再次通知 WebSub Hub
        run: |
          curl -sS --connect-timeout 10 --max-time 20 --retry 2 --retry-delay 2 \
            -X POST "https://pubsubhubbub.appspot.com/" \
            -d "hub.mode=publish" \
            -d "hub.url=https://raw.githubusercontent.com/loukafai/AutoMacauNewsToRss/refs/heads/main/rss.xml" || true
