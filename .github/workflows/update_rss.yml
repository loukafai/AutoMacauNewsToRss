name: 每日自動更新澳門日報 RSS

on:
  schedule:
    # 每 1 小時第 17 分執行一次（避開整點尖峰）
    - cron: '17 * * * *'
  workflow_dispatch: # 允許在 GitHub 網頁上手動點擊 "Run workflow" 執行

permissions:
  contents: write # 允許 Action 寫入與提交程式碼到 repo

concurrency:
  group: macau-daily-rss-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 簽出程式碼 (Checkout repository)
        uses: actions/checkout@v7

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 安裝依賴套件
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests beautifulsoup4
          fi

      - name: 🚀 執行爬蟲腳本生成檔案
        run: python main.py

      - name: 💾 檢查並提交更新 (Commit and Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add rss.xml index.html
          if git diff --cached --quiet; then
            echo "ℹ️ rss.xml 與 index.html 無變更，略過 commit 與 push。"
          else
            git commit -m "📝 自動更新今日新聞 (RSS & HTML)"
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"
            git push
          fi

      - name: 📡 推送完成後再次通知 WebSub Hub
        run: |
          sleep 5
          curl -sS --connect-timeout 10 --max-time 20 --retry 2 --retry-delay 2 \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            -X POST "https://pubsubhubbub.appspot.com/" \
            -d "hub.mode=publish" \
            -d "hub.url=https://raw.githubusercontent.com/loukafai/AutoMacauNewsToRss/main/rss.xml" || true
